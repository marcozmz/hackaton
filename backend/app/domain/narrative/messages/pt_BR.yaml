# --- Explicação detalhada ("Por que recebi essa recomendação?") ---
explanation:
  headline:
    simple: "Risco {risk_word}. Principal motivo: {main}"
    standard: "Risco {risk_word}. Principal motivo: {main}"
    technical: "risk_level={risk_level} (pior achado: {main_code}). {main}"
  in_favor: "A favor: {text}"
  confidence:
    simple: "Confiança {confidence_word} nesta orientação."
    standard: "Confiança {confidence_word} ({score}). {reduced}"
